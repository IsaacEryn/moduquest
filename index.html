<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      바깥으로 나가는 통로를 전부 막아 둔다. 그림과 소리를 코드로 만들기 때문에
      외부에서 받아올 것이 없다. 계정·실시간 채널이 쓰는 주소와, 자동 가입 방지
      상자를 띄우는 Cloudflare만 예외로 열어 둔다 — 그 둘은 함께 하기를 눌러야 불려 온다.
      파서가 이 지점을 지나야 적용되므로 charset 바로 다음에 있어야 한다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src https://challenges.cloudflare.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모두의 원정대</title>
    <meta name="description" content="서로 다른 감각과 인지 방식의 플레이어가 한 파티로 모험하는 접근성 우선 RPG" />
    <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./brand/favicon.ico" sizes="32x32 16x16" />
    <link rel="apple-touch-icon" href="./brand/icon-180.png" />
    <!-- 링크를 붙였을 때 뜨는 얼굴. 그림은 게임 안 스프라이트 그대로다 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="모두의 원정대" />
    <meta property="og:description" content="서로 다른 방식으로 감각하는 동료들이 한 파티로 떠나는 모험" />
    <meta property="og:image" content="https://moduquest.com/brand/og-card.png" />
    <meta property="og:url" content="https://moduquest.com/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="app">
      <h1 class="visually-hidden">모두의 원정대</h1>

      <!-- 시각 레이어: 게임 화면. 의미는 아래 DOM이 전달한다 -->
      <div id="game" aria-hidden="true"></div>

      <!-- 의미 레이어: 메뉴·대화·전투는 전부 여기서 -->
      <div id="ui"></div>

      <!-- 텍스트 렌즈: 게임 전체를 글로 따라가는 기록 창.
           스크린리더는 live region으로 같은 내용을 들으므로 여기는 시각 전용 -->
      <section id="text-log" aria-hidden="true"></section>

      <!-- 스크린리더 낭독 채널 -->
      <div id="sr-log" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
      <div id="sr-alert" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

      <!-- 효과음 자막 -->
      <p id="captions" aria-hidden="true"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
