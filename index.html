<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      바깥으로 나가는 통로를 전부 막아 둔다. 그림과 소리를 코드로 만들기 때문에
      외부에서 받아올 것이 없고, 나중에 계정 저장이 붙을 자리만 connect-src로 열어 둔다.
      파서가 이 지점을 지나야 적용되므로 charset 바로 다음에 있어야 한다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모두의 원정대</title>
    <meta name="description" content="서로 다른 감각과 인지 방식의 플레이어가 한 파티로 모험하는 접근성 우선 RPG" />
  </head>
  <body>
    <main id="app">
      <h1 class="visually-hidden">모두의 원정대</h1>

      <!-- 시각 레이어: 게임 화면. 의미는 아래 DOM이 전달한다 -->
      <div id="game" aria-hidden="true"></div>

      <!-- 의미 레이어: 메뉴·대화·전투는 전부 여기서 -->
      <div id="ui"></div>

      <!-- 텍스트 렌즈: 게임 전체를 글로 따라가는 기록 창.
           스크린리더는 live region으로 같은 내용을 들으므로 여기는 시각 전용 -->
      <section id="text-log" aria-hidden="true"></section>

      <!-- 스크린리더 낭독 채널 -->
      <div id="sr-log" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
      <div id="sr-alert" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

      <!-- 효과음 자막 -->
      <p id="captions" aria-hidden="true"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
