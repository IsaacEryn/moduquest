name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 빌드 잡은 외부 의존성 코드를 실행하므로 최소 권한만 준다.
# 배포 권한은 deploy 잡에만.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 관례를 사람의 기억이 아니라 파이프라인이 지키게 한다
      - name: 데이터 문자열을 innerHTML에 끼워 넣지 않았는지
        run: |
          if grep -rn "innerHTML" src --include='*.ts' | grep '\${'; then
            echo "innerHTML에 값을 보간하고 있다. textContent를 쓸 것."
            exit 1
          fi
      # 패턴에 [_]를 쓴 것은 이 검사 줄 자신이 걸리지 않게 하기 위해서다
      - name: 서버 전용 키가 섞여 들어가지 않았는지
        run: |
          if grep -rniE "service[_]role|SUPABASE[_]SERVICE" src .github; then
            echo "서버 전용 키가 클라이언트나 워크플로에 들어갔다."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
