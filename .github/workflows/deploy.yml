name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 빌드 잡은 외부 의존성 코드를 실행하므로 최소 권한만 준다.
# 배포 권한은 deploy 잡에만.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 빌드 잡은 저장소에 쓸 일이 없다 — 토큰을 작업 트리에 남기지 않는다
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 관례를 사람의 기억이 아니라 파이프라인이 지키게 한다.
      #
      # 세 검사 모두 한 줄만 보던 시절이 있었다. 이 저장소의 innerHTML은 전부
      # 여러 줄 템플릿이라, 본문 줄에 값을 끼워 넣으면 `innerHTML`이 있는 줄과
      # `${`가 있는 줄이 달라서 그냥 지나갔다. 파일을 통째로 읽어 비교한다.
      - name: 데이터 문자열을 innerHTML에 끼워 넣지 않았는지
        run: |
          bad=0
          for f in $(grep -rl "innerHTML" src); do
            perl -0777 -ne 'exit 1 if /innerHTML\s*=\s*`[^`]*\$\{/s' "$f" || { echo "$f"; bad=1; }
          done
          if [ "$bad" = 1 ]; then
            echo "innerHTML에 값을 보간하고 있다. textContent를 쓸 것."
            exit 1
          fi
      # 패턴에 [_]를 쓴 것은 이 검사 줄 자신이 걸리지 않게 하기 위해서다.
      #
      # 그 글자만 찾던 때는 정작 진짜 사고를 못 잡았다 — 붙여 넣는 것은 키(JWT)인데
      # 그건 base64라 그 글자가 나타나지 않는다. 모양으로도 찾고, 범위도 저장소
      # 전체로 넓힌다(빌드 산출물과 의존성만 뺀다).
      - name: 서버 전용 키가 섞여 들어가지 않았는지
        run: |
          if grep -rniE --exclude-dir={node_modules,dist,.git} "service[_]role|SUPABASE[_]SERVICE" .; then
            echo "서버 전용 키가 클라이언트나 워크플로에 들어갔다."
            exit 1
          fi
          if grep -rnE --exclude-dir={node_modules,dist,.git} "eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}" .; then
            echo "JWT 모양의 값이 저장소에 있다. 키는 Secrets에만 둔다."
            exit 1
          fi
      # VITE_로 시작하는 값은 무엇이든 브라우저 번들에 그대로 실린다.
      # 비밀로 두어야 할 것에 그 접두사가 붙으면 조용히 공개된다
      - name: 비밀 키에 VITE_ 접두사가 붙지 않았는지
        run: |
          if grep -rnE --exclude-dir={node_modules,dist,.git} \
            "VITE[_][A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|TOKEN)" .; then
            echo "VITE_ 접두사가 붙은 값은 브라우저로 나간다. 비밀이라면 접두사를 빼라."
            exit 1
          fi
      - run: npm test
      # 함께 하기의 서버 주소는 저장소가 아니라 Secrets에 있다.
      # 값이 비어 있어도 빌드는 성공하고, 게임은 혼자 하기만 열어 둔다
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 자동 가입 방지의 공개 열쇠. 이 줄이 빠지면 Secrets에 값이 있어도
          # 빌드에는 안 실려서, 화면에 상자가 안 뜬 채 서버만 표를 요구하게 된다
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      # 운영 페이지의 주소는 Secrets에만 있다. 배포 때 파일명을 그 이름으로
      # 바꿔 올리므로 저장소·번들·robots 어디에도 주소가 남지 않는다.
      # 슬러그가 없으면 아예 배포하지 않는다 — /admin.html이라는 뻔한 주소로
      # 나가는 사고를 구조적으로 막는 쪽이 낫다 (실질 방어는 어차피 RLS다)
      - name: 운영 페이지 주소 바꾸기
        env:
          SLUG: ${{ secrets.ADMIN_PATH_SLUG }}
        run: |
          if [ -z "$SLUG" ]; then
            rm -f dist/admin.html
            echo "ADMIN_PATH_SLUG 없음 — 운영 페이지 미배포"
          elif ! echo "$SLUG" | grep -qE '^[a-z0-9][a-z0-9-]{7,63}$' || [ "$SLUG" = "admin" ]; then
            echo "슬러그가 형식(소문자·숫자·하이픈 8~64자)에 안 맞거나 'admin'이다"
            exit 1
          else
            mv dist/admin.html "dist/${SLUG}.html"
            echo "운영 페이지 배포 준비 완료"
          fi
      # 규칙보다 사실이 낫다 — 실제로 나가는 파일을 열어 본다
      - name: 빌드 결과에 서버 전용 키가 없는지
        run: |
          if grep -rlE "service[_]role|-----BEGIN [A-Z ]*PRIVATE KEY-----" dist; then
            echo "빌드 결과물에 서버 전용 키가 들어 있다."
            exit 1
          fi
      # v4부터 숨김 파일(도트파일)은 묶음에 들어가지 않는다.
      # 이 게임의 dist에는 숨김 파일이 없으므로 그대로 둔다
      # 혼자 하는 실행은 서버 코드를 한 줄도 받지 않는다 — 이 성질은 정적 import 한 번에
      # 조용히 깨지므로, 사람의 주의가 아니라 빌드 결과로 지킨다
      - name: 첫 화면 번들에 서버 코드가 섞이지 않았는지
        run: |
          if grep -lE "GoTrueClient|RealtimeClient|SupabaseClient" dist/assets/index-*.js; then
            echo "supabase가 초기 번들에 실렸다. 서버를 쓰는 모듈은 동적 import로만 닿을 것."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
