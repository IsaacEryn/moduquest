name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 빌드 잡은 외부 의존성 코드를 실행하므로 최소 권한만 준다.
# 배포 권한은 deploy 잡에만.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 관례를 사람의 기억이 아니라 파이프라인이 지키게 한다
      - name: 데이터 문자열을 innerHTML에 끼워 넣지 않았는지
        run: |
          if grep -rn "innerHTML" src --include='*.ts' | grep '\${'; then
            echo "innerHTML에 값을 보간하고 있다. textContent를 쓸 것."
            exit 1
          fi
      # 패턴에 [_]를 쓴 것은 이 검사 줄 자신이 걸리지 않게 하기 위해서다
      - name: 서버 전용 키가 섞여 들어가지 않았는지
        run: |
          if grep -rniE "service[_]role|SUPABASE[_]SERVICE" src .github; then
            echo "서버 전용 키가 클라이언트나 워크플로에 들어갔다."
            exit 1
          fi
      # VITE_로 시작하는 값은 무엇이든 브라우저 번들에 그대로 실린다.
      # 비밀로 두어야 할 것에 그 접두사가 붙으면 조용히 공개된다
      - name: 비밀 키에 VITE_ 접두사가 붙지 않았는지
        run: |
          if grep -rnE "VITE[_][A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|TOKEN)" src .github; then
            echo "VITE_ 접두사가 붙은 값은 브라우저로 나간다. 비밀이라면 접두사를 빼라."
            exit 1
          fi
      - run: npm test
      # 함께 하기의 서버 주소는 저장소가 아니라 Secrets에 있다.
      # 값이 비어 있어도 빌드는 성공하고, 게임은 혼자 하기만 열어 둔다
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 자동 가입 방지의 공개 열쇠. 이 줄이 빠지면 Secrets에 값이 있어도
          # 빌드에는 안 실려서, 화면에 상자가 안 뜬 채 서버만 표를 요구하게 된다
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      # 규칙보다 사실이 낫다 — 실제로 나가는 파일을 열어 본다
      - name: 빌드 결과에 서버 전용 키가 없는지
        run: |
          if grep -rlE "service[_]role|-----BEGIN [A-Z ]*PRIVATE KEY-----" dist; then
            echo "빌드 결과물에 서버 전용 키가 들어 있다."
            exit 1
          fi
      # v4부터 숨김 파일(도트파일)은 묶음에 들어가지 않는다.
      # 이 게임의 dist에는 숨김 파일이 없으므로 그대로 둔다
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
